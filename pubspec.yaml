name: planify_mobile
description: "Planify smart life planner mobile app."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.5


dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: core
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  get_it: ^9.2.1
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  share_plus: ^12.0.2
  socket_io_client: ^3.1.2
  table_calendar: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.9.2
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  
flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/logo/planify_icon.png"

  min_sdk_android: 21

  adaptive_icon_foreground: "assets/logo/planify_icon.png"
  adaptive_icon_background: "#FFFFFF"


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/logo/
    - assets/translations/
    - assets/icon/

flutter_gen:
  output: core/lib/generated/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true

